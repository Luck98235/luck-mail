<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luck-Mail - 邮箱</title>
  <!-- FontAwesome 图标（CDN） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    /* 主题早恢复：避免首次渲染闪回蓝色（localStorage 键 luck-mail-theme） */
    try { var __t = localStorage.getItem('luck-mail-theme'); if (__t) { document.body.setAttribute('data-theme', __t); } } catch (e) {}
  </script>
</head>
<body class="bg-white text-slate-800" data-theme="blue">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
