<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luck-Mail - 邮箱</title>
    <!-- Tailwind CSS（与用户上传文件一致） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 图标（与用户上传文件一致） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 本项目响应式与自定义样式 -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 基础布局（滚动条样式已移到 css/style.css，用主题变量） -->
    <style>
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    </style>
</head>
<body class="bg-white text-slate-800 flex h-screen font-sans text-sm" data-mview="nav" data-theme="blue">
    <script>
        /* 主题早恢复：避免首次渲染闪回蓝色（app.js 里还会再确认一次） */
        try { var __t = localStorage.getItem('luck-mail-theme'); if (__t) { document.body.setAttribute('data-theme', __t); } } catch (e) {}
    </script>

    <!-- 栏目 1: 最左侧窄边栏 (系统导航) -->
    <nav id="sysnav" class="w-16 bg-blue-50 border-r border-blue-100 flex flex-col items-center py-4 flex-shrink-0 justify-between">
        <!-- 顶部头像 -->
        <div class="w-10 h-10 rounded-full bg-blue-200 text-blue-700 flex items-center justify-center font-bold shadow-sm border border-blue-300 cursor-pointer">
            <i class="fa-solid fa-user"></i>
        </div>

        <!-- 底部系统操作图标 -->
        <div class="flex flex-col gap-4 text-blue-400">
            <button class="w-10 h-10 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="设置" data-act="settings">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            <button class="w-10 h-10 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="修改密码" data-act="change-password">
                <i class="fa-solid fa-key text-lg"></i>
            </button>
            <button class="w-10 h-10 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="退出系统" data-act="logout">
                <i class="fa-solid fa-power-off text-lg"></i>
            </button>
            <button class="w-10 h-10 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="配色" data-theme-btn>
                <i class="fa-solid fa-palette text-lg"></i>
            </button>
        </div>
    </nav>

    <!-- 栏目 2: 左侧边栏 (邮件导航树) -->
    <aside id="mailsidebar" class="w-60 bg-blue-50/50 border-r border-blue-100 flex flex-col flex-shrink-0">
        <!-- 顶部 Logo -->
        <div class="h-16 flex items-center px-4 border-b border-blue-100/50 gap-2">
            <div class="w-8 h-8 bg-gradient-to-br from-blue-400 to-blue-600 rounded-lg flex items-center justify-center shadow-sm text-white">
                <i class="fa-solid fa-clover"></i>
            </div>
            <span class="font-black text-blue-700 tracking-wide text-lg">Luck-Mail</span>
        </div>

        <div class="p-3 flex gap-2">
            <button id="btn-compose" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-md flex items-center justify-center gap-2 shadow-sm transition-colors font-medium text-sm">
                <i class="fa-solid fa-pen"></i> 写信
            </button>
            <button id="btn-refresh-all" class="w-9 shrink-0 bg-white hover:bg-blue-50 text-blue-500 border border-blue-200 rounded-lg flex items-center justify-center shadow-sm transition-colors" title="全部刷新">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>
        </div>

        <!-- 导航树 -->
        <div class="flex-1 overflow-y-auto px-2 pb-4 space-y-4">

            <!-- 聚合分类（按上传文件：所有收件箱/所有未读/所有草稿/所有已发送/所有已删除） -->
            <div class="space-y-0.5 text-sm">
                <!-- 所有收件箱 (展开) -->
                <div>
                    <div class="flex items-center gap-2 px-2 py-1.5 bg-blue-100 text-blue-700 rounded cursor-pointer font-medium" data-nav="all-inbox" data-nav-label="所有收件箱">
                        <i class="fa-solid fa-chevron-down w-3 text-[10px] text-slate-400"></i>
                        <i class="fa-solid fa-inbox w-4 text-center text-blue-500"></i>
                        <span class="font-medium">所有收件箱</span>
                    </div>
                    <!-- 子项：各邮箱收件箱 -->
                    <div class="ml-6 mt-1 space-y-0.5" id="all-inbox-children">
                        <div class="flex items-center gap-2 px-2 py-1 text-slate-600 hover:bg-blue-100/50 rounded cursor-pointer" data-nav="inbox-demo1@163.com" data-nav-label="demo1@163.com">
                            <i class="fa-solid fa-inbox w-3 text-center text-slate-400 text-xs"></i>
                            <span class="truncate text-xs">demo1@163.com</span>
                        </div>
                        <div class="flex items-center gap-2 px-2 py-1 text-slate-600 hover:bg-blue-100/50 rounded cursor-pointer" data-nav="inbox-demo2@163.com" data-nav-label="demo2@163.com">
                            <i class="fa-solid fa-inbox w-3 text-center text-slate-400 text-xs"></i>
                            <span class="truncate text-xs">demo2@163.com</span>
                            <span class="text-red-500 font-bold text-xs ml-auto">(1)</span>
                        </div>
                        <div class="flex items-center gap-2 px-2 py-1 text-slate-600 hover:bg-blue-100/50 rounded cursor-pointer" data-nav="inbox-demo3@163.com" data-nav-label="demo3@163.com">
                            <i class="fa-solid fa-inbox w-3 text-center text-blue-500 text-xs"></i>
                            <span class="truncate text-xs">demo3@163.com</span>
                        </div>
                        <div class="flex items-center gap-2 px-2 py-1 text-slate-600 hover:bg-blue-100/50 rounded cursor-pointer" data-nav="inbox-demo4@163.com" data-nav-label="demo4@163.com">
                            <i class="fa-solid fa-inbox w-3 text-center text-slate-400 text-xs"></i>
                            <span class="truncate text-xs">demo4@163.com</span>
                        </div>
                    </div>
                </div>

                <!-- 其他聚合项 -->
                <div class="flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer mt-1" data-nav="all-unread" data-nav-label="所有未读">
                    <i class="fa-solid fa-chevron-right w-3 text-[10px] text-slate-400"></i>
                    <i class="fa-regular fa-envelope w-4 text-center text-blue-500"></i>
                    <span>所有未读 <span class="text-red-500 font-bold">(1)</span></span>
                </div>
                <div class="flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer" data-nav="all-drafts" data-nav-label="所有草稿">
                    <i class="fa-solid fa-chevron-right w-3 text-[10px] text-slate-400"></i>
                    <i class="fa-regular fa-file-lines w-4 text-center text-slate-400"></i>
                    <span>所有草稿</span>
                </div>
                <div class="flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer" data-nav="all-sent" data-nav-label="所有已发送">
                    <i class="fa-solid fa-chevron-right w-3 text-[10px] text-slate-400"></i>
                    <i class="fa-regular fa-paper-plane w-4 text-center text-slate-400"></i>
                    <span>所有已发送</span>
                </div>
                <div class="flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer" data-nav="all-trash" data-nav-label="所有已删除">
                    <i class="fa-solid fa-chevron-right w-3 text-[10px] text-slate-400"></i>
                    <i class="fa-regular fa-trash-can w-4 text-center text-slate-400"></i>
                    <span>所有已删除</span>
                </div>
            </div>

            <!-- 邮箱账号列表（平铺） -->
            <div class="pt-2">
                <div class="px-2 py-1 text-xs text-slate-400 mb-1">
                    邮箱
                </div>
                <div class="space-y-0.5 text-sm" id="account-list">
                    <div class="acct-item" data-acct="demo1@163.com">
                        <div class="acct-row flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer" data-acct-toggle="demo1@163.com">
                            <i class="fa-solid fa-chevron-right w-3 text-[10px] text-slate-400"></i>
                            <span class="w-4 h-4 rounded-full bg-red-500 text-white flex items-center justify-center text-[8px] font-bold">163</span>
                            <span class="truncate">demo1@163.com</span>
                        </div>
                        <div class="acct-folders ml-6 mt-0.5 space-y-0.5"></div>
                    </div>
                    <div class="acct-item" data-acct="demo2@163.com">
                        <div class="acct-row flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer" data-acct-toggle="demo2@163.com">
                            <i class="fa-solid fa-chevron-right w-3 text-[10px] text-slate-400"></i>
                            <span class="w-4 h-4 rounded-full bg-red-500 text-white flex items-center justify-center text-[8px] font-bold">163</span>
                            <span class="truncate">demo2@163.com</span>
                            <span class="text-red-500 font-bold text-xs ml-auto">(1)</span>
                        </div>
                        <div class="acct-folders ml-6 mt-0.5 space-y-0.5"></div>
                    </div>
                    <div class="acct-item" data-acct="demo3@163.com">
                        <div class="acct-row flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer" data-acct-toggle="demo3@163.com">
                            <i class="fa-solid fa-chevron-right w-3 text-[10px] text-blue-400"></i>
                            <span class="w-4 h-4 rounded-full bg-red-500 text-white flex items-center justify-center text-[8px] font-bold">163</span>
                            <span class="truncate">demo3@163.com</span>
                        </div>
                        <div class="acct-folders ml-6 mt-0.5 space-y-0.5"></div>
                    </div>
                    <div class="acct-item" data-acct="demo4@163.com">
                        <div class="acct-row flex items-center gap-2 px-2 py-1.5 text-slate-700 hover:bg-blue-100/50 rounded cursor-pointer" data-acct-toggle="demo4@163.com">
                            <i class="fa-solid fa-chevron-right w-3 text-[10px] text-slate-400"></i>
                            <span class="w-4 h-4 rounded-full bg-red-500 text-white flex items-center justify-center text-[8px] font-bold">163</span>
                            <span class="truncate">demo4@163.com</span>
                        </div>
                        <div class="acct-folders ml-6 mt-0.5 space-y-0.5"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 平板端系统操作（仅 768–1024px 显示，桌面/手机不显示） -->
        <div id="tablet-sysactions" class="hidden border-t border-blue-100 px-3 py-2 items-center justify-around text-blue-400">
            <button class="w-9 h-9 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="设置" data-act="settings">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button class="w-9 h-9 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="修改密码" data-act="change-password">
                <i class="fa-solid fa-key"></i>
            </button>
            <button class="w-9 h-9 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="退出系统" data-act="logout">
                <i class="fa-solid fa-power-off"></i>
            </button>
            <button class="w-9 h-9 rounded-full hover:bg-blue-100 hover:text-blue-600 transition-colors flex items-center justify-center" title="配色" data-theme-btn>
                <i class="fa-solid fa-palette"></i>
            </button>
        </div>
    </aside>

    <!-- 栏目 3: 邮件列表 -->
    <section id="maillist" class="w-[300px] bg-white border-r border-blue-100 flex flex-col flex-shrink-0">

        <!-- 手机端返回栏（仅 <768px 显示） -->
        <div class="mobile-backbar">
            <button class="mobile-backbtn" data-mback="nav" aria-label="返回邮箱">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span class="mobile-backtitle" id="mobile-list-title">收件箱</span>
            <span class="mobile-backspace"></span>
        </div>

        <!-- 列表头部工具栏 -->
        <div class="h-16 border-b border-blue-50 flex items-center justify-between px-4 bg-white">
            <div class="font-bold text-slate-700 text-base" id="list-title">收件箱</div>
            <div class="flex items-center gap-3 text-slate-400">
                <i class="fa-solid fa-rotate-right cursor-pointer hover:text-blue-500 transition-colors" title="刷新" id="btn-refresh"></i>
            </div>
        </div>

        <!-- 搜索框 -->
        <div class="p-2 border-b border-blue-50 bg-slate-50/50">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                <input id="search-input" type="text" placeholder="搜索邮件..." class="w-full bg-white border border-slate-200 rounded-md pl-8 pr-3 py-1.5 text-xs focus:ring-1 focus:ring-blue-400 focus:border-blue-400 transition-all outline-none">
            </div>
        </div>

        <!-- 邮件列表（由 js/app.js 渲染） -->
        <div class="flex-1 overflow-y-auto" id="message-list"></div>
    </section>

    <!-- 栏目 4: 右侧阅读面板 -->
    <main id="reading" class="flex-1 bg-white flex flex-col min-w-0">

        <!-- 手机端返回栏（仅 <768px 显示） -->
        <div class="mobile-backbar">
            <button class="mobile-backbtn" data-mback="list" aria-label="返回邮件列表">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span class="mobile-backtitle">邮件详情</span>
            <span class="mobile-backspace"></span>
        </div>

        <!-- 顶部操作栏 -->
        <div class="h-16 border-b border-blue-50 flex items-center px-6 bg-white flex-shrink-0">
            <div class="flex items-center gap-5 text-slate-500">
                <button class="hover:text-blue-500 hover:bg-blue-50 p-2 rounded transition-colors flex items-center gap-1.5 text-sm" title="回复" data-act="reply">
                    <i class="fa-solid fa-reply"></i>
                </button>
                <button class="hover:text-blue-500 hover:bg-blue-50 p-2 rounded transition-colors flex items-center gap-1.5 text-sm" title="转发" data-act="forward">
                    <i class="fa-solid fa-share"></i>
                </button>
                <div class="w-px h-4 bg-blue-100 mx-1"></div>
                <button class="hover:text-red-500 hover:bg-red-50 p-2 rounded transition-colors flex items-center gap-1.5 text-sm" title="删除" data-act="delete">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
                <button class="hover:text-amber-500 hover:bg-amber-50 p-2 rounded transition-colors flex items-center gap-1.5 text-sm" title="标记为垃圾邮件" data-act="spam">
                    <i class="fa-solid fa-ban"></i>
                </button>
            </div>
        </div>

        <!-- 邮件正文区域（由 js/app.js 渲染） -->
        <div class="flex-1 overflow-y-auto p-8 max-w-4xl w-full" id="reading-body"></div>

    </main>

    <!-- 写信弹窗（假数据演示） -->
    <div id="compose-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40">
        <div class="bg-white rounded-lg shadow-xl w-[560px] max-w-[92vw] flex flex-col overflow-hidden">
            <div class="flex items-center justify-between px-5 py-3 border-b border-blue-100">
                <span class="font-bold text-slate-700">写信</span>
                <button class="text-slate-400 hover:text-slate-600" data-close-compose aria-label="关闭">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-5 space-y-3">
                <div class="flex items-center gap-2">
                    <label class="w-12 text-xs text-slate-500">收件人</label>
                    <input id="compose-to" type="text" placeholder="收件人邮箱" class="flex-1 border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-blue-400 focus:border-blue-400">
                </div>
                <div class="flex items-center gap-2">
                    <label class="w-12 text-xs text-slate-500">主题</label>
                    <input id="compose-subject" type="text" placeholder="主题" class="flex-1 border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-blue-400 focus:border-blue-400">
                </div>
                <textarea id="compose-body" rows="8" placeholder="正文..." class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-blue-400 focus:border-blue-400 resize-y"></textarea>
            </div>
            <div class="flex items-center justify-end gap-2 px-5 py-3 border-t border-blue-100 bg-slate-50/50">
                <button class="px-4 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-100" data-save-draft>存草稿</button>
                <button class="px-4 py-2 rounded-md text-sm text-slate-600 hover:bg-slate-100" data-close-compose>取消</button>
                <button class="px-5 py-2 rounded-md text-sm bg-blue-500 hover:bg-blue-600 text-white font-medium" data-send-compose>发送</button>
            </div>
        </div>
    </div>

    <!-- 配色面板（点窄栏/平板栏的调色板按钮弹出，贴着按钮右侧） -->
    <div id="theme-panel" class="hidden">
        <div class="theme-title">主题配色</div>
        <div class="theme-grid">
            <button class="theme-swatch" data-theme-pick="blue"><span class="dot" style="background:#3b82f6"></span><span class="nm">蓝色</span></button>
            <button class="theme-swatch" data-theme-pick="green"><span class="dot" style="background:#22c55e"></span><span class="nm">绿色</span></button>
            <button class="theme-swatch" data-theme-pick="red"><span class="dot" style="background:#ef4444"></span><span class="nm">红色</span></button>
            <button class="theme-swatch" data-theme-pick="purple"><span class="dot" style="background:#a855f7"></span><span class="nm">紫色</span></button>
            <button class="theme-swatch" data-theme-pick="orange"><span class="dot" style="background:#f97316"></span><span class="nm">橙色</span></button>
            <button class="theme-swatch" data-theme-pick="teal"><span class="dot" style="background:#14b8a6"></span><span class="nm">青色</span></button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
